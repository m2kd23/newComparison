<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신구조문대비표 생성기</title>
<style>
  :root { --bd:#c9ced6; --bg:#f4f6f8; --fg:#1d232b; --muted:#5d6773; --acc:#1f5fbf; --warn:#a15c00; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "맑은 고딕","Malgun Gothic",sans-serif; font-size:14px; color:var(--fg); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--bd); padding:12px 20px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:12.5px; }
  main { padding:16px 20px 40px; max-width:1500px; margin:0 auto; }
  .inputs { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .box { background:#fff; border:1px solid var(--bd); border-radius:6px; padding:10px 12px; }
  .box h2 { font-size:14px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
  .box h2 small { font-weight:normal; color:var(--muted); font-size:12px; }
  textarea { width:100%; height:260px; resize:vertical; font-family:"맑은 고딕",monospace; font-size:12.5px; line-height:1.45; border:1px solid var(--bd); border-radius:4px; padding:8px; }
  .summary { font-size:12.5px; margin-top:6px; color:var(--muted); min-height:18px; }
  .summary b { color:var(--fg); }
  .summary .w { color:var(--warn); }
  .opts { margin-top:14px; display:grid; grid-template-columns:minmax(180px,0.7fr) 1.3fr 1.5fr; gap:0; padding:0; }
  .optgrp { padding:10px 16px; display:flex; flex-direction:column; gap:7px; }
  .optgrp + .optgrp { border-left:1px solid var(--bd); }
  .optttl { font-size:12px; font-weight:bold; color:var(--muted); margin-bottom:1px; }
  .opts label { display:flex; align-items:center; gap:6px; line-height:1.35; }
  .opts .fmt { display:flex; flex-direction:column; gap:7px; }
  .opts .fmt label { justify-content:space-between; max-width:190px; }
  .opts input[type=checkbox] { margin:0; width:15px; height:15px; flex:none; }
  .opts input[type=text] { border:1px solid var(--bd); border-radius:4px; padding:4px 6px; font-size:13px; }
  .opts input.w100 { width:110px; } .opts input.w50 { width:110px; }
  .actions { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; border:1px solid var(--bd); background:#fff; border-radius:5px; padding:7px 14px; cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:bold; }
  button:disabled { opacity:.45; cursor:default; }
  #msg { font-size:13px; color:var(--muted); }
  #msg.ok { color:#1b7f3b; } #msg.err { color:var(--err); }
  .result { margin-top:16px; }
  .stat { font-size:13px; margin-bottom:8px; }
  .stat b { margin-right:3px; }
  details { background:#fff; border:1px solid var(--bd); border-radius:6px; padding:8px 12px; margin-bottom:10px; font-size:12.5px; }
  details summary { cursor:pointer; font-weight:bold; }
  details ul { margin:6px 0 0; padding-left:18px; max-height:200px; overflow:auto; }
  .w { color:var(--warn); }
  #preview { background:#fff; border:1px solid var(--bd); border-radius:6px; padding:18px; overflow:auto; }
  #preview:focus-within { outline:2px solid #9bbcf0; }
  .hint { font-size:12px; color:var(--muted); margin:4px 0 8px; }
  @media (max-width: 900px) { .inputs, .opts { grid-template-columns:1fr; } .optgrp + .optgrp { border-left:0; border-top:1px solid var(--bd); } }
</style>
</head>
<body>
<header>
  <h1>신구조문대비표 생성기</h1>
  <span>현행·개정안을 한글에서 복사(Ctrl+A → Ctrl+C)해 붙여넣으면 대비표를 만듭니다. 인터넷 연결 없이 이 PC 안에서만 처리되며 입력 내용은 저장하지 않습니다.</span>
</header>
<main>
  <div class="inputs">
    <div class="box">
      <h2>현행 <small id="cntOld"></small></h2>
      <textarea id="txtOld" placeholder="현행 규정 전문을 붙여넣으세요.&#10;예)&#10;제1조(목적) 이 규정은 …&#10;제2조(정의) ① …&#10;  1. …"></textarea>
      <div class="summary" id="sumOld"></div>
    </div>
    <div class="box">
      <h2>개정안 <small id="cntNew"></small></h2>
      <textarea id="txtNew" placeholder="개정안 전문을 붙여넣으세요."></textarea>
      <div class="summary" id="sumNew"></div>
    </div>
  </div>

  <div class="opts box">
    <div class="optgrp">
      <div class="optttl">표 서식</div>
      <div class="fmt">
        <label>글꼴 <input type="text" id="optFont" class="w100" value="휴먼명조"></label>
        <label>크기(pt) <input type="text" id="optSize" class="w50" value="10"></label>
      </div>
    </div>
    <div class="optgrp">
      <div class="optttl">변경 표시</div>
      <label><input type="checkbox" id="optUnder" checked> 변경 부분 밑줄</label>
      <label><input type="checkbox" id="optColor" checked> <span>변경 부분 글씨색 (현행 <b style="color:#FF0000;font-weight:normal">빨강</b> / 개정안 <b style="color:#0000FF;font-weight:normal">파랑</b>)</span></label>
      <label><input type="checkbox" id="optNote" checked> &lt;단서 신설&gt;·&lt;후단 신설&gt; 표기</label>
    </div>
    <div class="optgrp">
      <div class="optttl">비교 범위</div>
      <label><input type="checkbox" id="optHeads" checked> 장·절 제목 변경 포함</label>
      <label><input type="checkbox" id="optRemoved" checked> 개정안에서 없어진 조·항·호도 &lt;삭 제&gt;로 표시</label>
      <label><input type="checkbox" id="optStrip" checked> &lt;개정 2024. 1. 1.&gt;, [본조신설 …] 같은 연혁 표시 제거</label>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="btnGen">대비표 만들기</button>
    <button id="btnCopy" disabled>표 복사 (한글에 붙여넣기)</button>
    <button id="btnSave" disabled>한글 파일로 저장 (.hwpx)</button>
    <button id="btnClear">입력 지우기</button>
    <span id="msg"></span>
  </div>

  <div class="result" id="result" hidden>
    <div class="stat" id="stat"></div>
    <details id="warnBox" hidden><summary class="w">확인이 필요한 항목 <span id="warnCnt"></span></summary><ul id="warnList"></ul></details>
    <details id="structBox"><summary>인식한 조문 구조 보기</summary><div id="structList" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px"></div></details>
    <div class="hint">아래 표는 직접 고칠 수 있습니다. 고친 내용(글자, 색, 밑줄)이 그대로 복사되고 한글 파일로 저장됩니다.</div>
    <div id="preview" contenteditable="true" spellcheck="false"></div>
  </div>
</main>

<script>
/* ===== 신구조문대비표 엔진 (core) ===== */
var SGCore = (function () {
  'use strict';

  var CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺㊻㊼㊽㊾㊿';
  var GANADA = '가나다라마바사아자차카타파하';

  // 레벨: 0=조, 1=항, 2=호, 3=목, 4=1), 5=가), 6=(1), 7=(가)
  var LEVEL_NAMES = ['조', '항', '호', '목', '세목', '세목', '세목', '세목'];
  var INDENT = [0, 0, 1, 2, 3, 4, 5, 6];

  function norm(s) {
    return (s || '').replace(/[\s 　]+/g, ' ').trim();
  }

  /* ---------- 1. 전처리 ---------- */
  var DATE = '\\d{4}\\s*\\.\\s*\\d{1,2}\\s*\\.\\s*\\d{1,2}\\s*\\.?';
  var RE_ANGLE = new RegExp('<[^<>]*' + DATE + '[^<>]*>', 'g');
  var RE_BRACKET = /\[[^\[\]]*(본조신설|전문개정|제목개정|본조제목개정|시행일|이동|종전|본조삭제|개정|신설|삭제|타법)[^\[\]]*\]/g;

  function cleanLine(line, opt) {
    var s = line.replace(/[​﻿]/g, '').replace(/ |　/g, ' ').replace(/\t/g, ' ');
    if (opt.stripTags) {
      if (/^\s*\[\s*시행일/.test(s)) return '';
      s = s.replace(RE_ANGLE, ' ');
      s = s.replace(RE_BRACKET, ' ');
    }
    return s.replace(/\s+$/, '');
  }

  /* ---------- 2. 구조 파싱 ---------- */
  var RE_JANG = /^제\s*(\d+)\s*(장|절|관)(?:\s*의\s*(\d+))?(?:\s+|$)(.*)$/;
  var RE_JO = /^제\s*(\d+)\s*조(?:\s*의\s*(\d+))?\s*(\((?:[^()]|\([^()]*\))*\))?(.*)$/;
  var RE_HANG = new RegExp('^([' + CIRCLED + '])\\s*(.*)$');
  var RE_HO = /^(\d+)(?:\s*의\s*(\d+))?\s*\.(?!\d)\s*(.*)$/;
  var RE_MOK = new RegExp('^([' + GANADA + '])(?:\\s*의\\s*(\\d+))?\\s*\\.\\s*(.*)$');
  var RE_S1 = /^(\d+)\s*\)\s*(.*)$/;
  var RE_S2 = new RegExp('^([' + GANADA + '])\\s*\\)\\s*(.*)$');
  var RE_S3 = /^\(\s*(\d+)\s*\)\s*(.*)$/;
  var RE_S4 = new RegExp('^\\(\\s*([' + GANADA + '])\\s*\\)\\s*(.*)$');
  var RE_BUCHIK = /^(부\s*칙|\[?\s*별\s*표|\[?\s*별\s*지|<\s*별\s*표)/;

  function isDeletedText(t) {
    return /^삭\s*제\.?$/.test(norm(t));
  }

  function mk(level, key, label, text) {
    return { level: level, key: key, label: label, text: text || '', children: [] };
  }

  function matchItem(t) {
    var m;
    if ((m = RE_HANG.exec(t))) return mk(1, [CIRCLED.indexOf(m[1]) + 1], m[1], m[2]);
    if ((m = RE_HO.exec(t))) return mk(2, [+m[1], m[2] ? +m[2] : 0], m[1] + (m[2] ? '의' + m[2] : '') + '.', m[3]);
    if ((m = RE_MOK.exec(t))) return mk(3, [GANADA.indexOf(m[1]) + 1, m[2] ? +m[2] : 0], m[1] + (m[2] ? '의' + m[2] : '') + '.', m[3]);
    if ((m = RE_S1.exec(t))) return mk(4, [+m[1]], m[1] + ')', m[2]);
    if ((m = RE_S2.exec(t))) return mk(5, [GANADA.indexOf(m[1]) + 1], m[1] + ')', m[2]);
    if ((m = RE_S3.exec(t))) return mk(6, [+m[1]], '(' + m[1] + ')', m[2]);
    if ((m = RE_S4.exec(t))) return mk(7, [GANADA.indexOf(m[1]) + 1], '(' + m[1] + ')', m[2]);
    return null;
  }

  function parse(text, opt) {
    opt = opt || {};
    var raw = (text || '').split(/\r\n|\r|\n/);
    var res = { title: '', meta: '', items: [], warnings: [], stats: { jo: 0, lines: 0, skippedHead: 0 } };
    var started = false, stack = [], curHead = null, chapNo = 0, lastNode = null;
    var headLines = [];

    for (var i = 0; i < raw.length; i++) {
      var line = cleanLine(raw[i], opt);
      var t = norm(line);
      if (!t) continue;

      var mj = RE_JANG.exec(t), mo = RE_JO.exec(t);
      // 조 헤더 판정: 제목(괄호)이 있거나, 뒤가 '삭제'이거나 비어 있어야 함
      var isJo = mo && (mo[3] || /^\s*(삭\s*제\.?)?\s*$/.test(mo[4]));

      if (!started) {
        if (mj || isJo) started = true;
        else { headLines.push(t); res.stats.skippedHead++; continue; }
      }
      if (RE_BUCHIK.test(t)) break;
      res.stats.lines++;

      if (mj) {
        var kind = mj[2];
        if (kind === '장') chapNo = +mj[1];
        var hk = kind === '장' ? '장' + mj[1] + '-' + (mj[3] || 0) : kind + chapNo + '-' + mj[1] + '-' + (mj[3] || 0);
        curHead = {
          type: 'head', kind: kind, hkey: hk, label: '제' + mj[1] + kind + (mj[3] ? '의' + mj[3] : ''),
          text: norm(mj[4]), deleted: isDeletedText(mj[4])
        };
        res.items.push(curHead);
        stack = []; lastNode = null;
        continue;
      }
      if (isJo) {
        var jo = mk(0, [+mo[1], mo[2] ? +mo[2] : 0], '제' + mo[1] + '조' + (mo[2] ? '의' + mo[2] : ''), '');
        jo.type = 'jo';
        jo.title = mo[3] ? norm(mo[3]) : '';
        var rest = norm(mo[4]);
        jo.deleted = isDeletedText(rest) && !jo.title;
        if (isDeletedText(rest)) jo.deleted = true;
        res.items.push(jo);
        res.stats.jo++;
        stack = [jo]; lastNode = jo;
        var first = rest && matchItem(rest);
        if (first && first.level === 1) { jo.children.push(first); stack.push(first); lastNode = first; }
        else jo.text = jo.deleted ? '삭제' : rest;
        continue;
      }
      if (!stack.length) { res.warnings.push('조문 밖 문장 무시: ' + t.slice(0, 40)); continue; }

      var it = matchItem(t);
      if (it) {
        while (stack.length > 1 && stack[stack.length - 1].level >= it.level) stack.pop();
        var parent = stack[stack.length - 1];
        parent.children.push(it);
        stack.push(it); lastNode = it;
      } else {
        // 번호 없는 문단 → 직전 항목의 이어지는 문단
        lastNode.text = lastNode.text ? lastNode.text + '\n' + t : t;
      }
    }
    for (var h = 0; h < headLines.length; h++) {
      if (!res.title && !/^[-\/\s]*$/.test(headLines[h])) res.title = headLines[h].replace(/\(\s*약칭\s*:[^)]*\)/, '').trim();
      if (!res.meta && /\[(시행|법률|제정|개정|전부개정|일부개정)/.test(headLines[h])) res.meta = headLines[h];
    }
    walkMarkDeleted(res.items);
    checkOrder(res);
    return res;
  }

  function walkMarkDeleted(nodes) {
    nodes.forEach(function (n) {
      if (n.type === 'head') return;
      if (n.level > 0) n.deleted = isDeletedText(n.text) && !n.children.length;
      walkMarkDeleted(n.children || []);
    });
  }

  function cmpKey(a, b) {
    for (var i = 0; i < Math.max(a.length, b.length); i++) {
      var x = a[i] || 0, y = b[i] || 0;
      if (x !== y) return x < y ? -1 : 1;
    }
    return 0;
  }

  function checkOrder(res) {
    var prev = null;
    res.items.forEach(function (n) {
      if (n.type !== 'jo') return;
      if (prev && cmpKey(prev.key, n.key) >= 0) res.warnings.push('조 번호 순서 이상: ' + prev.label + ' 다음에 ' + n.label);
      prev = n;
      (function rec(node) {
        for (var i = 1; i < node.children.length; i++) {
          var a = node.children[i - 1], b = node.children[i];
          if (a.level === b.level && cmpKey(a.key, b.key) >= 0)
            res.warnings.push(n.label + ': ' + LEVEL_NAMES[b.level] + ' 번호 순서 이상 (' + a.label + ' → ' + b.label + ')');
        }
        node.children.forEach(rec);
      })(n);
    });
  }

  /* ---------- 3. 비교 ---------- */
  function ownLine(n) {
    if (n.type === 'jo') return n.label + n.title + (n.text ? ' ' + n.text : '');
    return (n.label ? n.label + ' ' : '') + n.text;
  }

  function sameTree(a, b) {
    if (a.label !== b.label) return false;
    if (norm(a.text) !== norm(b.text)) return false;
    if (a.type === 'jo' && norm(a.title) !== norm(b.title)) return false;
    if (a.children.length !== b.children.length) return false;
    for (var i = 0; i < a.children.length; i++) {
      if (cmpKey(a.children[i].key, b.children[i].key) !== 0) return false;
      if (!sameTree(a.children[i], b.children[i])) return false;
    }
    return true;
  }

  // 한쪽만 항(①) 구조일 때 다른 쪽 본문을 가상의 제1항으로 감싼다
  function virtualize(a, b) {
    function hasHang(n) { return n.children.length && n.children[0].level === 1; }
    function wrap(n) {
      var c = n.children.length || n.text;
      if (!c) return n;
      var v = mk(1, [1], '', n.text); v.children = n.children; v.virtual = true;
      var copy = {}; for (var k in n) copy[k] = n[k];
      copy.text = ''; copy.children = [v];
      return copy;
    }
    if (hasHang(b) && !hasHang(a) && !a.deleted) a = wrap(a);
    else if (hasHang(a) && !hasHang(b) && !b.deleted) b = wrap(b);
    return [a, b];
  }

  function L(text, level, extra) {
    var o = { text: text, indent: INDENT[level] || 0 };
    if (extra) for (var k in extra) o[k] = extra[k];
    return o;
  }

  // 노드 전체(하위 포함)를 문단 목록으로
  function fullLines(n, prefix) {
    var out = [];
    var head = (prefix || '') + ownLine(n);
    var kids = n.children;
    if (n.type === 'jo' && !n.text && kids.length && kids[0].level === 1) {
      // 제N조(제목) ① ... 형태로 첫 항을 같은 문단에
      var firstLines = fullLines(kids[0], n.label + n.title + ' ');
      firstLines[0].indent = 0;
      return firstLines.concat(flatten(kids.slice(1)));
    }
    pushTextLines(out, head, n.level);
    return out.concat(flatten(kids));
  }
  function pushTextLines(out, text, level) {
    text.split('\n').forEach(function (s, i) { out.push(L(s, level, i ? { cont: true } : null)); });
  }
  function flatten(nodes) {
    var out = [];
    nodes.forEach(function (c) { out = out.concat(fullLines(c, '')); });
    return out;
  }

  function mergeByKey(ca, cb) {
    var i = 0, j = 0, out = [];
    while (i < ca.length || j < cb.length) {
      var a = ca[i], b = cb[j];
      if (a && b) {
        var c = a.level === b.level ? cmpKey(a.key, b.key) : (a.level < b.level ? -1 : 1);
        if (c === 0) { out.push([a, b]); i++; j++; }
        else if (c < 0) { out.push([a, null]); i++; }
        else { out.push([null, b]); j++; }
      } else if (a) { out.push([a, null]); i++; }
      else { out.push([null, b]); j++; }
    }
    return out;
  }

  var SIM_NOTE = 0.5, SIM_STRUCT = 0.5;
  var T = { omitOld: '(생  략)', omitNew: '(현행과 같음)', added: '<신  설>', deleted: '<삭  제>' };

  function row(left, right, kind) { return { left: left, right: right, kind: kind || 'mod' }; }
  function mark(text, level) { return [L(text, level, { marker: true })]; }

  function rangeLabel(nodes) {
    if (nodes.length === 1) return nodes[0].label;
    if (nodes.length === 2) return nodes[0].label + '·' + nodes[1].label;
    return nodes[0].label + ' ∼ ' + nodes[nodes.length - 1].label;
  }

  // 글자 단위 유사도(공백 제외): 공통 글자 수 / 긴 쪽 글자 수
  function tokenSim(x, y) {
    var ta = norm(x).replace(/\s/g, '').split(''), tb = norm(y).replace(/\s/g, '').split('');
    if (!ta.length || !tb.length) return 0;
    if (ta.length * tb.length > 4e6) return ta.join('') === tb.join('') ? 1 : 0.5;
    var mm = lcsMark(ta, tb), c = 0;
    mm[0].forEach(function (m) { if (!m) c++; });
    return c / Math.max(ta.length, tb.length);
  }
  function mainPart(t) { return norm(t).split(/ 다만, | 이 경우 /)[0]; }

  // 단서·후단 신설/삭제 표시
  function clauseNote(r, ta, tb) {
    var na = norm(ta), nb = norm(tb);
    var pats = [['다만,', '단서'], ['이 경우', '후단']];

    paras.forEach(function (p) {
      // 문단 앞뒤 공백 정리
      if (p.runs.length) { p.runs[0].t = p.runs[0].t.replace(/^\s+/, ''); var l = p.runs[p.runs.length - 1]; l.t = l.t.replace(/\s+$/, ''); }
    });
    return paras;
  }
  function previewToDoc() {
    var pv = $('preview'), tbl = pv.querySelector('table');
    if (!tbl) return null;
    var titleP = null;
    for (var n = pv.firstElementChild; n && n !== tbl; n = n.nextElementSibling) if (n.textContent.trim()) { titleP = n; break; }
    var size = parseFloat($('optSize').value) || 10;
    var pxPerLevel = 10 * 96 / 72; // 미리보기 들여쓰기 10pt
    var toLv = function (px) { return Math.round(px / pxPerLevel); };
    var heads = Array.prototype.map.call(tbl.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); });
    var rows = [];
    Array.prototype.forEach.call(tbl.querySelectorAll('tbody > tr'), function (tr) {
      var tds = tr.querySelectorAll('td');
      if (tds.length < 2) return;
      var cs = getComputedStyle(tds[0]);
      rows.push({
        top: cs.borderTopStyle !== 'none' && parseFloat(cs.borderTopWidth) > 0,
        bottom: cs.borderBottomStyle !== 'none' && parseFloat(cs.borderBottomWidth) > 0,
        cells: [cellParas(tds[0], toLv), cellParas(tds[1], toLv)]
      });
    });
    return {
      title: titleP ? titleP.textContent.replace(/ /g, ' ').trim() : '',
      font: ($('optFont').value || '휴먼명조').trim(), size: size,
      header: heads.length === 2 ? heads : ['현 행', '개 정 안'], rows: rows
    };
  }

  function saveHwpx() {
    var doc = previewToDoc();
    if (!doc || !doc.rows.length) { setMsg('저장할 대비표가 없습니다.', 'err'); return; }
    var bytes = SGHwpx.build(doc);
    var name = (lastTitle || '신구조문대비표').replace(/[\\\/:*?"<>|「」]/g, '').trim() || '신구조문대비표';
    var blob = new Blob([bytes], { type: 'application/hwp+zip' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '_신구조문대비표.hwpx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    setMsg('한글 파일(.hwpx)을 저장했습니다. 다운로드 폴더에서 열어 보세요.', 'ok');
  }

  function live() {
    var o = opts();
    ['Old', 'New'].forEach(function (k) {
      var t = $('txt' + k).value;
      summarize(SGCore.parse(t, o), $('sum' + k), $('cnt' + k), t);
    });
  }
  var timer = null;
  ['txtOld', 'txtNew'].forEach(function (id) {
    $(id).addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(live, 300); });
  });
  $('btnGen').addEventListener('click', function () {
    setMsg('처리 중…');
    setTimeout(function () {
      try { generate(); } catch (e) { setMsg('오류: ' + e.message, 'err'); if (window.console) console.error(e); }
    }, 10);
  });
  $('btnCopy').addEventListener('click', copyTable);
  $('btnSave').addEventListener('click', function () {
    try { saveHwpx(); } catch (e) { setMsg('한글 파일 저장 오류: ' + e.message, 'err'); if (window.console) console.error(e); }
  });
  $('btnClear').addEventListener('click', function () {
    $('txtOld').value = $('txtNew').value = '';
    $('result').hidden = true; $('preview').innerHTML = '';
    $('btnCopy').disabled = $('btnSave').disabled = true;
    live(); setMsg('');
  });
})();
</script>
</body>
</html>
